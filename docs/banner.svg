<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">OpenUT99-Plus</title>
  <desc id="desc">A clean-room Unreal Engine 1 runtime that runs Unreal Tournament from your own installation</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset="0.55" stop-color="#140c2e"/>
      <stop offset="1" stop-color="#07131f"/>
    </linearGradient>
    <radialGradient id="nebula" cx="0.72" cy="0.35" r="0.45">
      <stop offset="0" stop-color="#7a3fa8" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#2a6f8f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9483a"/>
      <stop offset="1" stop-color="#5a1d18"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="14" fill="url(#space)"/>
  <rect width="1200" height="260" rx="14" fill="url(#nebula)"/>
  <g fill="#e8ecff">
    <circle cx="40" cy="30" r="1.2"/><circle cx="130" cy="210" r="1"/><circle cx="210" cy="24" r="1.4"/>
    <circle cx="300" cy="196" r="1"/><circle cx="380" cy="40" r="1.1"/><circle cx="455" cy="218" r="1.3"/>
    <circle cx="520" cy="22" r="1"/><circle cx="610" cy="52" r="1.5"/><circle cx="690" cy="20" r="1"/>
    <circle cx="760" cy="96" r="1.2"/><circle cx="830" cy="34" r="1"/><circle cx="905" cy="70" r="1.4"/>
    <circle cx="980" cy="28" r="1"/><circle cx="1050" cy="104" r="1.2"/><circle cx="1120" cy="44" r="1.5"/>
    <circle cx="1170" cy="130" r="1"/><circle cx="660" cy="128" r="0.9"/><circle cx="560" cy="200" r="1"/>
  </g>
  <circle cx="1150" cy="46" r="12" fill="#dff6ff" opacity="0.9"/>
  <circle cx="1150" cy="46" r="26" fill="#7fd8ff" opacity="0.18"/>
  <!-- a stylised floating arena: platforms on pillars with a tower -->
  <g transform="translate(940 128) scale(0.82)">
    <rect x="70" y="-62" width="56" height="70" fill="#8e2f26"/>
    <rect x="84" y="-86" width="28" height="26" fill="#a3392e"/>
    <rect x="0" y="8" width="230" height="12" fill="#c9c6b8"/>
    <rect x="0" y="8" width="230" height="5" fill="#e3c13a"/>
    <rect x="22" y="20" width="14" height="44" fill="#4a2a2a"/>
    <rect x="194" y="20" width="14" height="44" fill="#4a2a2a"/>
    <path d="M-60 64 L300 64 L330 96 L-90 96 Z" fill="url(#deck)"/>
    <path d="M-20 96 L250 96 L190 140 L40 140 Z" fill="#3a1411"/>
  </g>
  <text x="70" y="118" font-family="Verdana, Arial, sans-serif" font-size="74" font-weight="bold" fill="#f2f4ff" stroke="#120a24" stroke-width="2">OpenUT99-Plus</text>
  <text x="74" y="162" font-family="Verdana, Arial, sans-serif" font-size="24" fill="#cfd6ff">Unreal Engine 1, rebuilt from scratch · bring your own Unreal Tournament</text>
  <rect x="10" y="10" width="1180" height="240" rx="9" fill="none" stroke="#cfd6ff" stroke-opacity="0.35" stroke-width="2"/>
</svg>
